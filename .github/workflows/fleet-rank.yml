
name: Fleet Rank Monitor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  check-rank:
    runs-on: ubuntu-latest

    steps:
      - name: Check fleet rank and notify
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          API_URL = "https://fleet.swgoh.dev/api/shards/88kr8x8hip"
          ALLY_CODE = 121537521
          WEBHOOK = os.environ.get("DISCORD_WEBHOOK")

          if not WEBHOOK:
              raise RuntimeError("DISCORD_WEBHOOK secret is missing.")

          request = urllib.request.Request(
              API_URL,
              headers={"User-Agent": "FleetRankMonitor/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.loads(response.read().decode("utf-8"))

          player = next(
              (p for p in data["players"]
               if int(p["ally_code"]) == ALLY_CODE),
              None
          )

          if player is None:
              raise RuntimeError("Your Ally Code was not found in the shard.")

          current_rank = int(player["fleet_rank"])

          message = (
              f"🚀 Fleet Arena Rank Report\n"
              f"Player: {player['name']}\n"
              f"Current Rank: #{current_rank}"
          )

          payload = json.dumps({"content": message}).encode("utf-8")

          req = urllib.request.Request(
              WEBHOOK,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              print(f"Discord notification sent: HTTP {response.status}")
              print(f"Current fleet rank: #{current_rank}")
          PY

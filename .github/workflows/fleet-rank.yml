name: Fleet Rank Monitor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  check-rank:
    runs-on: ubuntu-latest

    steps:
      - name: Check fleet rank and notify
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          API_URL = "https://fleet.swgoh.dev/api/shards/88kr8x8hip"
          ALLY_CODE = 121537521
          WEBHOOK = os.environ.get("DISCORD_WEBHOOK")

          if not WEBHOOK:
              raise RuntimeError("DISCORD_WEBHOOK secret is missing.")

          # Read fleet rank
          request = urllib.request.Request(
              API_URL,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.loads(response.read().decode("utf-8"))
                  print(f"Fleet API response: HTTP {response.status}")
          except urllib.error.HTTPError as e:
              print(f"Fleet API error: HTTP {e.code}")
              print(e.read().decode("utf-8", errors="replace"))
              raise

          player = next(
              (p for p in data["players"]
               if int(p["ally_code"]) == ALLY_CODE),
              None
          )

          if player is None:
              raise RuntimeError("Your Ally Code was not found in the shard.")

          current_rank = int(player["fleet_rank"])
          player_name = player.get("name", "Unknown")

          print(f"Player: {player_name}")
          print(f"Current fleet rank: #{current_rank}")

          # Send Discord notification
          message = (
              f"🚀 Fleet Arena Rank Report\n"
              f"Player: {player_name}\n"
              f"Current Rank: #{current_rank}"
          )

          payload = json.dumps({"content": message}).encode("utf-8")

          req = urllib.request.Request(
              WEBHOOK,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36",
                  "Accept": "*/*"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  print(f"Discord response: HTTP {response.status}")
                  print("Notification sent successfully.")
          except urllib.error.HTTPError as e:
              print(f"Discord error: HTTP {e.code}")
              print(e.read().decode("utf-8", errors="replace"))
              raise
          PY


name: Fleet Rank Monitor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fleet-rank-monitor
  cancel-in-progress: false

jobs:
  check-rank:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check fleet rank and notify
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          API_URL = "https://fleet.swgoh.dev/api/shards/88kr8x8hip"
          ALLY_CODE = 121537521
          STATE_FILE = Path("fleet-rank-state.json")

          request = urllib.request.Request(
              API_URL,
              headers={"User-Agent": "FleetRankMonitor/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.loads(response.read().decode("utf-8"))

          player = next(
              (p for p in data["players"]
               if int(p["ally_code"]) == ALLY_CODE),
              None
          )

          if player is None:
              raise RuntimeError("Your Ally Code was not found in the shard.")

          current_rank = int(player["fleet_rank"])

          previous_rank = None
          if STATE_FILE.exists():
              previous = json.loads(STATE_FILE.read_text())
              previous_rank = int(previous["fleet_rank"])

          print(f"Previous rank: {previous_rank}")
          print(f"Current rank: {current_rank}")

          if previous_rank is None:
              print("First run: saving initial rank, no notification.")

          elif current_rank != previous_rank:
              webhook = os.environ.get("DISCORD_WEBHOOK")
              if not webhook:
                  raise RuntimeError("DISCORD_WEBHOOK secret is missing.")

              change = current_rank - previous_rank
              direction = "dropped" if change > 0 else "improved"

              message = (
                  f"🔔 Fleet Arena rank changed!\n"
                  f"Previous rank: #{previous_rank}\n"
                  f"Current rank: #{current_rank}\n"
                  f"Rank {direction} by {abs(change)} places."
              )

              payload = json.dumps({"content": message}).encode("utf-8")

              req = urllib.request.Request(
                  webhook,
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              with urllib.request.urlopen(req, timeout=30) as response:
                  print(f"Discord notification sent: HTTP {response.status}")

          else:
              print("Rank unchanged. No notification.")

          STATE_FILE.write_text(json.dumps({
              "ally_code": ALLY_CODE,
              "fleet_rank": current_rank
          }, indent=2) + "\n")
          PY

      - name: Save latest rank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fleet-rank-state.json
          if git diff --cached --quiet; then
            echo "Rank unchanged; no state commit needed."
          else
            git commit -m "Update fleet rank state"
            git push
          fi
